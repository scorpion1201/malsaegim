[package]
name = "malsaegim-engine"
version = "0.1.0"
edition = "2021"
description = "말새김 On-Device 인식 엔진 (Rust 래퍼 + whisper.cpp)"

[lib]
name = "malsaegim_engine"
crate-type = ["staticlib"]
path = "src/lib.rs"

# 빌드 도구도 엔진 소스 안에 둔다: `cargo run -p malsaegim-engine --bin xtask -- <out>` 가 엔진 wasm 을 만든다
[[bin]]
name = "xtask"
path = "src/bin/xtask.rs"

# wasm 빌드에서만 켠다 (xtask) — 네이티브 lint 빌드는 심볼을 내지 않는다
[features]
whisper = []