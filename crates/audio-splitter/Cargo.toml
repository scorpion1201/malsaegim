[package]
name = "audio-splitter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "audio (mp3/m4a/wav/flac/ogg…) -> 16kHz mono WAV chunks for ASR (wasm)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
symphonia = { version = "0.6", default-features = false, features = ["all"] }
wasm-bindgen = "0.2"
js-sys = "0.3"